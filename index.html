<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZB Tech | المنصة التكنولوجية الرسمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* كارت التعريف الرئيسي */
        .profile-card {
            background: linear-gradient(145deg, #131b2e, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
            padding: 35px 20px 25px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* شعار ZB المتوهج */
        .logo-zb {
            width: 95px;
            height: 95px;
            border-radius: 22px;
            background: linear-gradient(135deg, #06b6d4, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.25);
            letter-spacing: 1px;
        }

        .name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .bio {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* شريط الإحصائيات الفخم */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 10px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* الأقسام والأزرار */
        .section-header {
            font-size: 1.05rem;
            color: #38bdf8;
            margin: 22px 0 12px;
            padding-right: 8px;
            border-right: 3px solid #38bdf8;
            font-weight: 700;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111827;
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 15px 18px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .btn-link:active {
            transform: scale(0.98);
            border-color: #38bdf8;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .svg-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* شبكة الخدمات */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .service-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            text-align: right;
        }

        .service-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #a855f7;
            margin-bottom: 4px;
        }

        .service-desc {
            font-size: 0.78rem;
            color: #64748b;
        }

        footer {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- بطاقة التعريف واللوجو -->
        <div class="profile-card">
            <div class="logo-zb">ZB</div>
            <h1 class="name">زينو | ZB Tech</h1>
            <p class="bio">صانع محتوى تقني • مطور تطبيقات ومواقع • مهندس حلول رقمية مبتكرة</p>
            
            <!-- إحصائيات 137K+ -->
            <div class="stats-bar">

                </div>
                <div class="stat-item">
                    <div class="stat-value">100%</div>
                    <div class="stat-label">أدوات مجانية</div>

                <div class="stat-item">
                    <div class="stat-value">PRO</div>
                    <div class="stat-label">حلول برمجة</div>

            </div>
        </div>
