    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zino Tech | المنصة الرسمية</title>
    <!-- استدعاء خط تاجوال العصري ومكتبة الأيقونات الشهيرة FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        /* كارت البروفايل ورمز ZB الفخم */
        .profile-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 60%);
            z-index: 0;
        }

        .profile-content {
            position: relative;
            z-index: 1;
        }

        /* رمز ZB الأسطوري في شاشة كبيرة وبطريقة تكنولوجية فخمة */
        .logo-box {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .name {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .bio {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* الأزرار والأيقونات */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-link i.icon-left {
            color: #38bdf8;
            font-size: 1.2rem;
            transition: transform 0.3s;
        }
