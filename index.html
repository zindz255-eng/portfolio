<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZB Tech | المنصة التكنولوجية الرسمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        /* الكارت الرئيسي */
        .profile-card {
            background: #131b2e;
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        /* لوجو ZB الأسطوري */
        .logo-zb {
            width: 85px;
            height: 85px;
            border-radius: 20px;
            background: linear-gradient(135deg, #06b6d4, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .name {
            font-size: 1.7rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .bio {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* الإحصائيات مرتبة بدقة */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 2px;
        }

        /* عناوين الأقسام */
        .section-header {
            font-size: 1rem;
            color: #38bdf8;
            margin: 20px 0 10px;
            padding-right: 8px;
            border-right: 3px solid #38bdf8;
            font-weight: 700;
        }

        /* الأزرار الاحترافية */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111827;
            color: #f8fafc;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .btn-link:active {
            background: #1f2937;
            border-color: #38bdf8;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* شبكة الخدمات المصغرة */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .service-card {
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            text-align: right;
        }

        .service-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #a855f7;
            margin-bottom: 3px;
        }

        .service-desc {
            font-size: 0.75rem;
            color: #64748b;
        }

        footer {
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

                    <div class="stat-value">137K+</div>
                    <div class="stat-label">متابع تقني</div>
                </div>
            </div>
        </div>
